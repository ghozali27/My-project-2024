<!DOCTYPE html>
<html>
<head>

	<!-- judul dan icon web -->
	<link rel="icon" type="image/png" href="img/logo.png">
	<title>Portal Akademik</title>

	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<!-- Bootstrap CSS -->
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/stylenya.css">

	<!-- Boostrap javasript -->
	<script type="text/javascript" src="js/jquery-3.4.1.min.js"></script>
	<script type="text/javascript" src="js/bootstrap.js"></script>
	<script type="text/javascript" src="js/login.js"></script>
</head>
<body>

<!-- Login -->

<div class="container">
    <form id="loginForm">
        <div class="form-group">
            <h4 align="center">Selamat Datang</h4><hr/>
            <h5 align="center"><b>Mahasiswa/Santri</h5>
            <h5 align="center">PORTAL AKADEMIK</h5>
            <img class="img" src="img/logo.png">
            <label for="pengguna">Pengguna</label>
            <input type="text" class="form-control" id="pengguna" placeholder="Masukkan NIM">
            
            <label for="password">Kata Kunci</label>
            <input type="password" class="form-control" id="password" placeholder="Masukkan password">
            
            <button type="submit" class="btn btn-primary">Login</button>
        </div>
    </form>
</div>
</body>
</html>
